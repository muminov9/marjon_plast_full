services:
  - type: web
    name: marjon-plast
    runtime: node
    plan: free
    rootDir: marjon_v4
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Diqqat: Render free plan da disk vaqtinchalik (ephemeral) — data.json restartda yo'qoladi.
    # Shuning uchun ma'lumotlar albatta Neon/Supabase PostgreSQL da saqlanadi (DATABASE_URL kerak).
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: BACKUP_RETENTION
        value: "14"